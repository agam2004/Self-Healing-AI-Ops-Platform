name: Build and Push

on:
  push:
    branches: [main]

permissions:
  id-token: write     # required to fetch the OIDC token
  contents: read
  security-events: write   # required to upload SARIF to the Security tab

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aiops-app
  EKS_CLUSTER_NAME: aiops-cluster

jobs:
  # Gate: nothing builds or deploys until this passes. Each scanner uploads
  # SARIF to the repo's Security tab regardless of pass/fail, so findings
  # are visible there even on a red run, not just in the job log.
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Gitleaks needs full history to scan past commits, not just the diff

      - name: Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci
          generateSarif: "1"

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Trivy filesystem scan (dependency CVEs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy fs SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build-test-deploy:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        working-directory: app
        run: python -m unittest test_app.py -v

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./app
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan (container CVEs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Push image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: docker push "$IMAGE"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      # KNOWN LIMITATION: this step reaches the EKS API over its public
      # endpoint, which terraform/variables.tf's eks_public_access_cidrs
      # restricts to one known IP by design (see eks.tf). GitHub-hosted
      # runners have no stable IP, so as configured this step can only
      # succeed if that variable is (temporarily) widened, e.g.
      # `-var='eks_public_access_cidrs=["0.0.0.0/0"]'` — deliberately not
      # the default, since it trades away the CIDR restriction for CI
      # convenience. The commands themselves are verified working (run by
      # hand against the live cluster from an allowlisted IP); what's
      # unverified end-to-end is only this network path. The correct fix
      # is a self-hosted runner inside the VPC, so the API endpoint never
      # needs to be open beyond one trusted IP — not yet built.
      - name: Deploy to EKS
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/aiops-app aiops-app="$IMAGE" -n default
          kubectl rollout status deployment/aiops-app -n default --timeout=120s
