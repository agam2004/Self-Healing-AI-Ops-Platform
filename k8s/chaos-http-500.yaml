# Fault injection: rewrite every response from aiops-app's pods to HTTP
# 500 for 5 minutes. blackbox-exporter's probe (terraform/observability.tf)
# sees the rewritten response and starts failing; after it fails for 1
# minute straight, the HighErrorRate alert fires; Alertmanager posts to
# the in-cluster forwarder; the forwarder invokes the AI-Ops Lambda; the
# Lambda asks Bedrock for a root-cause summary, posts it to Slack, and
# restarts the aiops-app Deployment.
#
# Note: restarting the Deployment does NOT clear this fault — HTTPChaos
# targets pods by label selector, so freshly restarted pods matching
# app=aiops-app are immediately faulted again too. That's expected: this
# experiment models "something is broken at the traffic layer," which a
# pod restart genuinely can't fix, so use `kubectl delete -f
# k8s/chaos-http-500.yaml` to end the experiment once you've observed the
# alert/notify/remediate cycle — that's the equivalent of the underlying
# issue actually getting fixed.
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: aiops-http-500
  namespace: default
spec:
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: aiops-app
  target: Response
  port: 8080
  path: "/"
  method: GET
  abort: false
  replace:
    code: 500
  duration: "5m"
